# journald retention limits for the XAUUSDT paper service logs.
# Place at /etc/systemd/journald.conf.d/xauusdt.conf and run:
#   sudo systemctl restart systemd-journald
[Journal]
# Cap total journal storage (10MiB for a lightweight paper runtime).
SystemMaxUse=10M
# Keep a single "ring" — cheap for one low-volume service.
SystemKeepFree=50M